name: Validate Website

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required files
        run: |
          test -f index.html
          test -f script.js
          test -f styles.css
          test -f data/products.js
          test -f data/products_template.csv
          test -f wrangler.jsonc

      - name: Block unresolved merge markers
        run: |
          if rg -n "^(<<<<<<<|=======|>>>>>>>)" .; then
            echo "Found unresolved merge markers"
            exit 1
          fi

      - name: Validate HTML essentials
        run: |
          grep -q '<meta name="viewport"' index.html
          grep -q '<title>' index.html
          grep -q 'script src="data/products.js"' index.html
          grep -q 'script src="script.js"' index.html
          grep -q 'link rel="stylesheet" href="styles.css"' index.html

      - name: Validate core CSS selectors exist
        run: |
          grep -q '^:root' styles.css
          grep -q '\.product-card' styles.css
          grep -q '\.quickview' styles.css

      - name: Validate JavaScript syntax
        run: node --check script.js
